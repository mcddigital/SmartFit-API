
spring.application.name=smartfitapi

# Banco PostgreSQL em producao e H2 no desenvolvimento
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/smartfit}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Criacao e atualizacao das tabelas
spring.jpa.hibernate.ddl-auto=update

# Porta configurada pelo servidor
server.port=${PORT:8080}

